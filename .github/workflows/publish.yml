name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run security:check
      - run: node --check lib/client.js
      - name: Require public-safe npm account email
        env:
          NPM_PUBLIC_EMAIL_CONFIRMED: ${{ vars.NPM_PUBLIC_EMAIL_CONFIRMED }}
        run: |
          if [ "$NPM_PUBLIC_EMAIL_CONFIRMED" != "true" ]; then
            echo "Set NPM_PUBLIC_EMAIL_CONFIRMED=true only after the npm account email is safe for public metadata."
            exit 1
          fi
      - run: npm publish --provenance --access public --registry https://registry.npmjs.org/
