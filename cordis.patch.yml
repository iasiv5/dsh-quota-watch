# Mount the host-side quota watcher; the browser half is supplied by dsh.client.
#
# Automatic card use is retired (docs/adr/0004): the quota poll is strictly
# read-only and a reset card is only ever spent from the panel after an explicit
# manual confirmation, journaled before the irreversible POST. There is no
# authorization switch left in this profile config.
#   pollIntervalSec : quota check cadence in seconds (30-3600). The reset-card
#     wallet is polled on its own ten-minute read-only gate.
- insert:
    - id: quota-watch
      name: '@iasiv5/dsh-quota-watch'
      config:
        pollIntervalSec: 60
